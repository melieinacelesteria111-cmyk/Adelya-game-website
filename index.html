<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adel-Game Pro 🌸</title>
    <style>
        :root { --pink: #ff1493; --light-pink: #ffb3e6; --bg: #ffe4f0; }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg), #e0f7ff);
            margin: 0; padding: 0; min-height: 100vh; touch-action: manipulation;
            overflow-x: hidden;
        }
        header { text-align: center; padding: 20px 0; }
        .logo {
            width: 70px; height: 70px; background: linear-gradient(45deg, var(--pink), #ff69b4);
            border-radius: 20px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 900; color: white; border: 4px solid white;
            box-shadow: 0 8px 20px rgba(255,105,180,0.5);
        }
        .title { font-size: 2.2rem; color: var(--pink); margin: 10px 0 0; }
        
        .games-grid {
            padding: 15px; display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; max-width: 500px; margin: 0 auto 50px;
        }
        .game-btn {
            background: white; border: 3px solid var(--light-pink); border-radius: 20px;
            padding: 20px 10px; display: flex; flex-direction: column; align-items: center;
            gap: 10px; transition: 0.2s; cursor: pointer;
        }
        .game-btn:active { transform: scale(0.95); background: var(--bg); }
        .game-btn span { font-size: 2.5rem; }
        .game-btn b { color: var(--pink); font-size: 1rem; }

        .game-container {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .game-active { display: flex !important; }
        
        /* Mencegah layar HP ikut tergeser saat main game */
        canvas { 
            background: white; border-radius: 15px; max-width: 95vw; 
            border: 5px solid var(--light-pink); touch-action: none; cursor: crosshair;
        }

        .game-ui { color: white; margin-bottom: 15px; text-align: center; width: 100%; }
        .back-btn {
            position: absolute; top: 20px; left: 20px; background: var(--pink);
            color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer;
        }

        #game-over {
            position: fixed; inset: 0; background: rgba(255,20,147,0.9);
            z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AD</div>
        <div class="title">Adel-Game</div>
        <p style="color: #ff69b4;">✨ Support HP & PC/Laptop ✨</p>
    </header>

    <div class="games-grid">
        <div class="game-btn" onclick="startGame('dino')"><span>🦕</span><b>Dino Run</b></div>
        <div class="game-btn" onclick="startGame('snake')"><span>🐍</span><b>Snake</b></div>
        <div class="game-btn" onclick="startGame('flappy')"><span>🐦</span><b>Flappy Bird</b></div>
        <div class="game-btn" onclick="startGame('pingpong')"><span>🏓</span><b>Ping Pong</b></div>
        <div class="game-btn" onclick="startGame('catch')"><span>🧺</span><b>Catch Apple</b></div>
        <div class="game-btn" onclick="startGame('tictactoe')"><span>❌</span><b>TicTacToe</b></div>
    </div>

    <div id="game-screen" class="game-container">
        <button class="back-btn" onclick="exitGame()">← Menu</button>
        <div class="game-ui">
            <h2 id="game-title">Game Name</h2>
            <div style="font-size: 1.2rem;">Score: <span id="cur-score">0</span> | Best: <span id="hi-score">0</span></div>
        </div>
        <div id="canvas-holder"></div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 3rem;">GAME OVER 💔</h1>
        <p style="font-size: 1.5rem;">Skor Kamu: <span id="final-score">0</span></p>
        <button onclick="restartGame()" style="padding: 15px 40px; border-radius: 30px; border: none; font-size: 1.2rem; font-weight: bold; color: var(--pink); cursor: pointer;">Coba Lagi 🥺</button>
    </div>

    <script>
        let currentId = null;
        let score = 0;
        let loop = null;
        let canvas, ctx;
        let highScores = JSON.parse(localStorage.getItem('adel_scores')) || {};

        // Mencegah scroll layar pakai tombol spasi atau panah saat main di PC
        window.addEventListener("keydown", function(e) {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1 && currentId) {
                e.preventDefault();
            }
        }, false);

        function startGame(id) {
            currentId = id;
            score = 0;
            document.getElementById('game-screen').classList.add('game-active');
            document.getElementById('game-title').innerText = id.toUpperCase();
            document.getElementById('cur-score').innerText = "0";
            document.getElementById('hi-score').innerText = highScores[id] || 0;
            
            setupCanvas();
            window['run_' + id]();
        }

        function setupCanvas() {
            const holder = document.getElementById('canvas-holder');
            holder.innerHTML = '';
            canvas = document.createElement('canvas');
            canvas.width = Math.min(window.innerWidth - 40, 400);
            canvas.height = 400;
            holder.appendChild(canvas);
            ctx = canvas.getContext('2d');
            
            // Reset input keyboard setiap ganti game
            window.onkeydown = null;
        }

        function updateScore(points) {
            score += points;
            document.getElementById('cur-score').innerText = score;
            if (!highScores[currentId] || score > highScores[currentId]) {
                highScores[currentId] = score;
                localStorage.setItem('adel_scores', JSON.stringify(highScores));
                document.getElementById('hi-score').innerText = score;
            }
        }

        function gameOver() {
            if(loop) cancelAnimationFrame(loop);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('game-over').style.display = 'none';
            startGame(currentId);
        }

        function exitGame() {
            currentId = null;
            if(loop) cancelAnimationFrame(loop);
            document.getElementById('game-screen').classList.remove('game-active');
            document.getElementById('game-over').style.display = 'none';
            window.onkeydown = null;
        }

        // ================= GAME: PING PONG =================
        function run_pingpong() {
            let ball = { x: 200, y: 200, dx: 4, dy: 4, r: 10 };
            let paddle = { w: 100, h: 15, x: 150 };
            
            const movePaddle = (e) => {
                let rect = canvas.getBoundingClientRect();
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                paddle.x = clientX - rect.left - paddle.w/2;
            };
            
            // Support Mouse & Touch
            canvas.addEventListener('touchmove', movePaddle, {passive: true});
            canvas.addEventListener('mousemove', movePaddle);

            function play() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#ff1493';
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#444';
                ctx.fillRect(paddle.x, canvas.height - 30, paddle.w, paddle.h);

                ball.x += ball.dx; ball.y += ball.dy;
                if(ball.x < ball.r || ball.x > canvas.width - ball.r) ball.dx *= -1;
                if(ball.y < ball.r) ball.dy *= -1;
                
                if(ball.y > canvas.height - 45 && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                    ball.dy = -Math.abs(ball.dy) - 0.5; // Makin cepat
                    ball.y = canvas.height - 45; // Cegah bola tembus paddle
                    updateScore(1);
                }
                
                if(ball.y > canvas.height) return gameOver();
                loop = requestAnimationFrame(play);
            }
            play();
        }

        // ================= GAME: DINO RUN =================
        function run_dino() {
            let dinoY = 300, velY = 0, isJumping = false;
            let obsX = canvas.width;
            
            const jump = () => { if(!isJumping){ velY = -15; isJumping = true; } };
            
            // Support Touch, Klik, dan Spasi PC
            canvas.onpointerdown = jump; 
            window.onkeydown = (e) => { if(e.code === "Space" || e.code === "ArrowUp") jump(); };

            function play() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.strokeStyle = '#ddd'; ctx.strokeRect(0, 340, canvas.width, 1);
                
                velY += 0.8; dinoY += velY;
                if(dinoY > 300) { dinoY = 300; isJumping = false; }

                obsX -= 6 + (score/10);
                if(obsX < -30) { obsX = canvas.width + Math.random() * 100; updateScore(1); }

                ctx.font = "40px Arial";
                ctx.fillText("🦕", 50, dinoY + 30);
                ctx.fillText("🌵", obsX, 335 + 30);

                // Hitbox collision
                if(obsX < 90 && obsX > 30 && dinoY > 270) return gameOver();
                loop = requestAnimationFrame(play);
            }
            play();
        }

        // ================= GAME: CATCH APPLE =================
        function run_catch() {
            let basketX = canvas.width / 2 - 20, apple = { x: 200, y: 0, speed: 4 };
            
            const moveBasket = (e) => {
                let rect = canvas.getBoundingClientRect();
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                basketX = clientX - rect.left - 20;
            };
            
            // Support Mouse & Touch
            canvas.addEventListener('touchmove', moveBasket, {passive: true});
            canvas.addEventListener('mousemove', moveBasket);

            function play() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                apple.y += apple.speed;
                
                if(apple.y > canvas.height) return gameOver();

                if(apple.y > 330 && Math.abs(apple.x - basketX) < 50) {
                    updateScore(1);
                    apple.y = 0; apple.x = Math.random() * (canvas.width - 40);
                    apple.speed += 0.3;
                }

                ctx.font = "40px Arial";
                ctx.fillText("🍎", apple.x, apple.y);
                ctx.fillText("🧺", basketX, 380);

                loop = requestAnimationFrame(play);
            }
            play();
        }

        // ================= GAME: SNAKE =================
        function run_snake() {
            let cols = Math.floor(canvas.width / 20);
            let rows = Math.floor(canvas.height / 20);
            let s = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}], d = {x:0, y:-1}, f = {x:5, y:5}, tick = 0;
            
            // Support Swipe HP
            let tsX, tsY;
            canvas.ontouchstart = e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; e.preventDefault(); };
            canvas.ontouchend = e => {
                let dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
                if(Math.abs(dx) > 30 || Math.abs(dy) > 30) { // Butuh jarak swipe minimal
                    if(Math.abs(dx) > Math.abs(dy)) { if(d.x === 0) d = {x: dx>0?1:-1, y:0}; }
                    else { if(d.y === 0) d = {x:0, y:dy>0?1:-1}; }
                }
            };

            // Support Keyboard PC
            window.onkeydown = (e) => {
                if(e.code === "ArrowUp" && d.y === 0) d = {x:0, y:-1};
                if(e.code === "ArrowDown" && d.y === 0) d = {x:0, y:1};
                if(e.code === "ArrowLeft" && d.x === 0) d = {x:-1, y:0};
                if(e.code === "ArrowRight" && d.x === 0) d = {x:1, y:0};
            };

            function play() {
                if(tick++ % 8 !== 0) { loop = requestAnimationFrame(play); return; }
                ctx.clearRect(0,0,canvas.width,canvas.height);
                
                let head = {x: s[0].x + d.x, y: s[0].y + d.y};
                
                if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return gameOver();
                for(let i=0; i<s.length; i++) { if(head.x === s[i].x && head.y === s[i].y) return gameOver(); }
                
                s.unshift(head);
                if(head.x === f.x && head.y === f.y) {
                    updateScore(1);
                    f = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
                } else s.pop();

                ctx.font = "18px Arial";
                ctx.fillText("🍎", f.x*20, f.y*20 + 15);
                ctx.fillStyle = "#ff69b4";
                s.forEach(p => ctx.fillRect(p.x*20, p.y*20, 18, 18));
                
                loop = requestAnimationFrame(play);
            }
            play();
        }

        // ================= GAME: FLAPPY =================
        function run_flappy() {
            let birdY = 200, v = 0, pipeX = canvas.width, gap = 130, hole = 100;
            
            const flap = () => { v = -8; };
            
            // Support Touch, Klik, dan Spasi PC
            canvas.onpointerdown = flap;
            window.onkeydown = (e) => { if(e.code === "Space" || e.code === "ArrowUp") flap(); };

            function play() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                v += 0.5; birdY += v;
                pipeX -= 3;
                if(pipeX < -50) { pipeX = canvas.width; hole = 50 + Math.random()*150; updateScore(1); }

                ctx.fillStyle = "#ffb3e6";
                ctx.fillRect(pipeX, 0, 50, hole);
                ctx.fillRect(pipeX, hole + gap, 50, canvas.height);

                ctx.font = "30px Arial";
                ctx.fillText("🐦", 50, birdY);

                if(birdY > canvas.height || birdY < 0) return gameOver();
                // Hitbox collision yang lebih akurat
                if(pipeX < 80 && pipeX > 10 && (birdY < hole + 20 || birdY > hole + gap - 10)) return gameOver();

                loop = requestAnimationFrame(play);
            }
            play();
        }

        // ================= GAME: TICTACTOE =================
        function run_tictactoe() {
            let board = [['', '', ''], ['', '', ''], ['', '', '']];
            let player = '❌';
            let cw = canvas.width / 3;
            let ch = canvas.height / 3;
            let gameActive = true;

            function drawBoard() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.strokeStyle = '#ffb3e6';
                ctx.lineWidth = 4;
                
                for(let i=1; i<3; i++) {
                    ctx.beginPath(); ctx.moveTo(i*cw, 0); ctx.lineTo(i*cw, canvas.height); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i*ch); ctx.lineTo(canvas.width, i*ch); ctx.stroke();
                }

                ctx.font = "50px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                for(let r=0; r<3; r++) {
                    for(let c=0; c<3; c++) {
                        if(board[r][c]) ctx.fillText(board[r][c], c*cw + cw/2, r*ch + ch/2);
                    }
                }
            }

            function checkWin() {
                for(let i=0; i<3; i++) {
                    if(board[i][0] !== '' && board[i][0]===board[i][1] && board[i][1]===board[i][2]) return board[i][0];
                    if(board[0][i] !== '' && board[0][i]===board[1][i] && board[1][i]===board[2][i]) return board[0][i];
                }
                if(board[0][0] !== '' && board[0][0]===board[1][1] && board[1][1]===board[2][2]) return board[0][0];
                if(board[0][2] !== '' && board[0][2]===board[1][1] && board[1][1]===board[2][0]) return board[0][2];
                
                let isDraw = true;
                for(let r=0; r<3; r++) for(let c=0; c<3; c++) if(board[r][c]==='') isDraw = false;
                return isDraw ? 'Draw' : null;
            }

            // Support Touch & Click (Menggunakan onpointerdown yang mencakup keduanya)
            canvas.onpointerdown = (e) => {
                if(!gameActive) return;
                let rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                
                let c = Math.floor(x / cw);
                let r = Math.floor(y / ch);

                if(board[r][c] === '') {
                    board[r][c] = player;
                    drawBoard();
                    let winner = checkWin();
                    
                    if(winner) {
                        gameActive = false;
                        setTimeout(() => {
                            if(winner === '❌') {
                                updateScore(1); 
                                board = [['', '', ''], ['', '', ''], ['', '', '']]; 
                                gameActive = true;
                                drawBoard();
                            } else {
                                gameOver();
                            }
                        }, 500);
                    } else {
                        player = '⭕';
                        setTimeout(botMove, 300);
                    }
                }
            };

            function botMove() {
                if(!gameActive) return;
                let emptyCells = [];
                for(let r=0; r<3; r++) for(let c=0; c<3; c++) if(board[r][c]==='') emptyCells.push({r, c});
                
                if(emptyCells.length > 0) {
                    let move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    board[move.r][move.c] = player;
                    drawBoard();
                    
                    let winner = checkWin();
                    if(winner) {
                        gameActive = false;
                        setTimeout(gameOver, 500);
                    } else {
                        player = '❌';
                    }
                }
            }

            drawBoard();
        }
    </script>
</body>
</html>
